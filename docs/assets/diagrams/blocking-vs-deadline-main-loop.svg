<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" lang="ru">
<title id="title">Блокирующее ожидание и проверка срока в main при коротком ISR</title><desc id="desc">Условная трасса, не аппаратное измерение; длительности ISR увеличены для видимости. В обоих вариантах разрешённый короткий ISR фиксирует отдельное событие в условные 60 мс; это событие не перезапускает показанный LED-импульс. При HAL_Delay(80) с 40 до 120 мс main не обслуживает другие задачи, поэтому обрабатывает событие и проверяет срок импульса только около 120 мс. В варианте с проверкой времени main продолжает короткие проходы, обрабатывает событие в следующем проходе и выключает импульс около срока 100 мс. Проверка срока не гарантирует точного аппаратного дедлайна; задержку определяют длительность задач, работа IRQ и момент следующего прохода. Потери событий зависят от контракта флага, счётчика или очереди, а не только от задержки main.</desc>
