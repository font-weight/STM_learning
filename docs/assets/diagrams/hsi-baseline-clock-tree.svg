<text x="175" y="168" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#285A80">HSI</text>
<text x="175" y="209" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#183443">8 МГц</text>
<rect x="450" y="130" width="250" height="112" rx="12" fill="#EDF4FA" stroke="#285A80" stroke-width="1.6"/>
<text x="575" y="168" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#285A80">SYSCLK</text>
<text x="575" y="209" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#183443">8 МГц</text>
<rect x="900" y="130" width="250" height="112" rx="12" fill="#EDF4FA" stroke="#285A80" stroke-width="1.6"/>
<text x="1025" y="168" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#285A80">HCLK</text>
<text x="1025" y="209" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#183443">8 МГц</text>
<path d="M 300 186 H 443" fill="none" stroke="#435C69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="374" y="157" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#435C69">напрямую</text>
<path d="M 700 186 H 893" fill="none" stroke="#435C69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="796" y="157" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#435C69">AHB /1</text>
<path d="M 1025 242 V 285 H 280 V 343" fill="none" stroke="#435C69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 900 285 V 343" fill="none" stroke="#435C69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="900" cy="285" r="4" fill="#435C69"/>
<rect x="100" y="350" width="360" height="107" rx="12" fill="#EDF4FA" stroke="#285A80" stroke-width="1.6"/>
<text x="280.0" y="388" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#285A80">APB1 /1</text>
<text x="280.0" y="428" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#183443">PCLK1 = 8 МГц</text>
<rect x="680" y="350" width="440" height="107" rx="12" fill="#EDF4FA" stroke="#285A80" stroke-width="1.6"/>
<text x="900.0" y="388" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#285A80">APB2 /1</text>
<text x="900.0" y="428" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#183443">PCLK2 = 8 МГц</text>
