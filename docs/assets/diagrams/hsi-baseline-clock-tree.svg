<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc" lang="ru">
<title id="title">Базовое дерево тактирования STM32F103C8: HSI 8 МГц</title><desc id="desc">В основном маршруте курса PLL выключен. HSI номинально 8 МГц подаётся на SYSCLK; AHB /1 даёт HCLK 8 МГц. APB1 /1 даёт PCLK1 8 МГц и тактовую частоту TIM2/TIM3 8 МГц. APB2 /1 даёт PCLK2 8 МГц и тактовую частоту TIM1 8 МГц. Делитель ADC /2 от PCLK2 даёт ADCCLK 4 МГц. Для F103: при делителе APB /1 частота таймера равна PCLK, при другом делителе равна двум PCLK. Частота событий таймера дополнительно зависит от PSC и ARR.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#435C69"/></marker></defs>
<rect width="1200" height="730" fill="#FCFDFE"/>
<text x="40" y="47" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#183443">Базовые часы: проследи путь до периферии</text>
<text x="40" y="81" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#435C69">STM32F103C8 · основной маршрут курса · номинальные частоты, PLL выключен</text>
