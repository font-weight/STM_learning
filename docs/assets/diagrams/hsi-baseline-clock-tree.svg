<path d="M 900 457 V 485 H 745 V 518" fill="none" stroke="#435C69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 900 485 H 1020 V 518" fill="none" stroke="#435C69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1070" y="491" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#435C69">ADC /2</text>
<rect x="100" y="525" width="360" height="99" rx="12" fill="#EAF5F0" stroke="#006958" stroke-width="1.6"/>
<text x="280" y="563" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#006958">TIM2 · TIM3</text>
<text x="280" y="600" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#183443">8 МГц</text>
<rect x="640" y="525" width="210" height="99" rx="12" fill="#EAF5F0" stroke="#006958" stroke-width="1.6"/>
<text x="745" y="563" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#006958">TIM1</text>
<text x="745" y="600" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#183443">8 МГц</text>
<rect x="890" y="525" width="260" height="99" rx="12" fill="#EAF5F0" stroke="#006958" stroke-width="1.6"/>
<text x="1020" y="563" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#006958">ADCCLK</text>
<text x="1020" y="600" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#183443">4 МГц</text>
<text x="40" y="667" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#435C69">Правило F103: APB /1 → fTIM = PCLK; другой делитель APB → fTIM = 2 × PCLK.</text>
<text x="40" y="702" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#435C69">8 МГц на TIM — частота его тактирования. Частоту событий задают также PSC и ARR.</text>
</svg>
